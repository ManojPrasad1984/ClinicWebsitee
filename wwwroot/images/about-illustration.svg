<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" height="780">
  <defs>
    <linearGradient id="a-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fd"/>
      <stop offset="100%" stop-color="#e2eaf6"/>
    </linearGradient>
    <linearGradient id="a-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccd8e8"/>
      <stop offset="100%" stop-color="#aabcd4"/>
    </linearGradient>
    <linearGradient id="a-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2b98a"/>
      <stop offset="100%" stop-color="#d9915e"/>
    </linearGradient>
    <linearGradient id="a-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fa"/>
