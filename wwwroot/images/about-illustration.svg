  <ellipse cx="452" cy="318" rx="8" ry="11" fill="#d9915e"/>
  <!-- Eyes -->
  <ellipse cx="393" cy="314" rx="6" ry="6.5" fill="#2a1508"/>
  <ellipse cx="423" cy="314" rx="6" ry="6.5" fill="#2a1508"/>
  <ellipse cx="395" cy="312" rx="2" ry="2" fill="#fff"/>
  <ellipse cx="425" cy="312" rx="2" ry="2" fill="#fff"/>
