  <rect x="48" y="60" width="110" height="145" rx="3" fill="#f5f8fd"/>
  <rect x="56" y="72" width="94" height="6" rx="3" fill="#c9a84c" fill-opacity="0.8"/>
  <rect x="56" y="84" width="75" height="3" rx="1.5" fill="#6a8aaa" fill-opacity="0.6"/>
  <rect x="56" y="91" width="82" height="3" rx="1.5" fill="#6a8aaa" fill-opacity="0.5"/>
  <rect x="56" y="98" width="68" height="3" rx="1.5" fill="#6a8aaa" fill-opacity="0.5"/>
