  <path d="M475 415 Q495 405 508 392" stroke="#f2b98a" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M475 415 Q495 405 508 392" stroke="#d9915e" stroke-width="19" fill="none" stroke-linecap="round"/>
