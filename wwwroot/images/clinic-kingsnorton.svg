  <rect x="150" y="20" width="20" height="36" rx="2" fill="#1a3060"/>
  <rect x="148" y="16" width="24" height="6" rx="2" fill="#2a4880"/>
  <rect x="310" y="22" width="20" height="34" rx="2" fill="#1a3060"/>
  <rect x="308" y="18" width="24" height="6" rx="2" fill="#2a4880"/>

