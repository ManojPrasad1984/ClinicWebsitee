  <rect x="100" y="68" width="280" height="128" fill="#162848"/>
  <!-- Stone quoins on corners -->
  <rect x="100" y="68" width="14" height="128" fill="#1a3060"/>
  <rect x="366" y="68" width="14" height="128" fill="#1a3060"/>
  <!-- Quoin stones -->
  <g fill="#1e3870">
    <rect x="100" y="72" width="14" height="12"/><rect x="100" y="90" width="14" height="12"/>
    <rect x="100" y="108" width="14" height="12"/><rect x="100" y="126" width="14" height="12"/>
    <rect x="100" y="144" width="14" height="12"/><rect x="100" y="162" width="14" height="12"/>
    <rect x="366" y="72" width="14" height="12"/><rect x="366" y="90" width="14" height="12"/>
    <rect x="366" y="108" width="14" height="12"/><rect x="366" y="126" width="14" height="12"/>
    <rect x="366" y="144" width="14" height="12"/><rect x="366" y="162" width="14" height="12"/>
