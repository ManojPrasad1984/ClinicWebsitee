  <ellipse cx="34" cy="140" rx="28" ry="38" fill="#0d2812"/>
  <ellipse cx="34" cy="130" rx="20" ry="28" fill="#0d3014"/>
  <ellipse cx="34" cy="120" rx="14" ry="22" fill="#0e3816"/>

  <rect x="440" y="155" width="8" height="48" rx="4" fill="#1a3a18"/>
  <ellipse cx="444" cy="144" rx="26" ry="36" fill="#0d2812"/>
  <ellipse cx="444" cy="134" rx="18" ry="26" fill="#0d3014"/>

  <rect x="68" y="162" width="6" height="40" rx="3" fill="#1a3a18"/>
