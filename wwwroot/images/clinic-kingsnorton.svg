<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">
  <defs>
    <linearGradient id="kn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1e30"/>
      <stop offset="100%" stop-color="#1a3a5a"/>
    </linearGradient>
    <linearGradient id="kn-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8c97a"/>
    </linearGradient>
  </defs>
  <!-- Dusk sky -->
  <rect width="480" height="260" fill="url(#kn-sky)"/>
  <!-- Subtle clouds -->
  <ellipse cx="100" cy="35" rx="55" ry="18" fill="#1e3a58" fill-opacity="0.6"/>
  <ellipse cx="350" cy="25" rx="70" ry="16" fill="#1e3a58" fill-opacity="0.5"/>
  <ellipse cx="420" cy="45" rx="40" ry="12" fill="#1e3a58" fill-opacity="0.4"/>

  <!-- Green / lawn area -->
  <rect x="0" y="196" width="480" height="64" fill="#0a1e10"/>
  <rect x="0" y="196" width="480" height="10" fill="#0d2415"/>
  <!-- Path -->
  <rect x="196" y="198" width="88" height="65" rx="3" fill="#0e1e30"/>
  <!-- Path lines -->
  <line x1="196" y1="210" x2="284" y2="210" stroke="#122030" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="196" y1="224" x2="284" y2="224" stroke="#122030" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="196" y1="238" x2="284" y2="238" stroke="#122030" stroke-width="1" stroke-opacity="0.8"/>

