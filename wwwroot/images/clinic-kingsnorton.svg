  <rect x="127" y="102" width="42" height="28" fill="#c9a84c" fill-opacity="0.42"/>
  <line x1="148" y1="78" x2="148" y2="130" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="124" y1="110" x2="172" y2="110" stroke="#0d1829" stroke-width="1.5"/>
  <ellipse cx="148" cy="92" rx="18" ry="14" fill="#c9a84c" fill-opacity="0.12"/>

  <rect x="216" y="78" width="48" height="52" rx="24" fill="#c9a84c" fill-opacity="0.48"/>
  <rect x="219" y="102" width="42" height="28" fill="#c9a84c" fill-opacity="0.48"/>
  <line x1="240" y1="78" x2="240" y2="130" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="216" y1="110" x2="264" y2="110" stroke="#0d1829" stroke-width="1.5"/>
  <ellipse cx="240" cy="92" rx="18" ry="14" fill="#c9a84c" fill-opacity="0.15"/>

  <rect x="308" y="78" width="48" height="52" rx="24" fill="#c9a84c" fill-opacity="0.38"/>
  <rect x="311" y="102" width="42" height="28" fill="#c9a84c" fill-opacity="0.38"/>
  <line x1="332" y1="78" x2="332" y2="130" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="308" y1="110" x2="356" y2="110" stroke="#0d1829" stroke-width="1.5"/>

  <!-- Windows second row -->
  <rect x="124" y="142" width="44" height="36" rx="3" fill="#c9a84c" fill-opacity="0.32"/>
  <line x1="146" y1="142" x2="146" y2="178" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="124" y1="160" x2="168" y2="160" stroke="#0d1829" stroke-width="1.5"/>

  <rect x="308" y="142" width="44" height="36" rx="3" fill="#c9a84c" fill-opacity="0.3"/>
  <line x1="330" y1="142" x2="330" y2="178" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="308" y1="160" x2="352" y2="160" stroke="#0d1829" stroke-width="1.5"/>

  <!-- Central entrance with canopy -->
  <path d="M190 168 Q240 148 290 168" fill="#c9a84c" fill-opacity="0.62"/>
  <path d="M190 168 Q240 152 290 168" fill="#c9a84c" fill-opacity="0.4"/>
  <!-- Pillars -->
  <rect x="190" y="168" width="8" height="30" rx="2" fill="#2a4a72"/>
  <rect x="282" y="168" width="8" height="30" rx="2" fill="#2a4a72"/>
  <!-- Door -->
  <rect x="200" y="168" width="38" height="30" rx="2" fill="#0a1020"/>
  <rect x="242" y="168" width="38" height="30" rx="2" fill="#0a1020"/>
  <!-- Door windows -->
  <rect x="204" y="172" width="30" height="20" rx="2" fill="#c9a84c" fill-opacity="0.18"/>
  <rect x="246" y="172" width="30" height="20" rx="2" fill="#c9a84c" fill-opacity="0.18"/>
  <!-- Door handles -->
  <circle cx="236" cy="183" r="3" fill="#c9a84c" fill-opacity="0.6"/>
  <circle cx="244" cy="183" r="3" fill="#c9a84c" fill-opacity="0.6"/>

  <!-- Signboard -->
  <rect x="175" y="136" width="130" height="14" rx="3" fill="#c9a84c" fill-opacity="0.85"/>
  <rect x="180" y="140" width="94" height="4" rx="2" fill="#0d1829"/>
  <rect x="186" y="147" width="80" height="2.5" rx="1.25" fill="#0d1829" fill-opacity="0.6"/>

  <!-- Gold roof trim -->
  <rect x="88" y="64" width="304" height="6" rx="2" fill="url(#kn-gold)" fill-opacity="0.65"/>

  <!-- Street lamp -->
  <rect x="52" y="150" width="5" height="52" rx="2" fill="#1e3a5a"/>
  <path d="M54 150 Q54 138 68 136" stroke="#1e3a5a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="70" cy="134" rx="10" ry="7" fill="#c9a84c" fill-opacity="0.8"/>
  <ellipse cx="70" cy="140" rx="14" ry="5" fill="#c9a84c" fill-opacity="0.1"/>
</svg>
