  <rect x="200" y="143" width="80" height="14" rx="2" fill="#0d1829" fill-opacity="0.8"/>
  <rect x="204" y="147" width="58" height="3" rx="1.5" fill="#c9a84c" fill-opacity="0.7"/>
  <rect x="210" y="153" width="46" height="2.5" rx="1.25" fill="#c9a84c" fill-opacity="0.45"/>

