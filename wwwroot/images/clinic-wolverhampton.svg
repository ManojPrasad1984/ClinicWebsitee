  <rect x="54" y="148" width="5" height="56" rx="2" fill="#1e3a5a"/>
  <path d="M56 148 Q56 136 70 134" stroke="#1e3a5a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="72" cy="132" rx="10" ry="7" fill="#c9a84c" fill-opacity="0.8"/>
  <ellipse cx="72" cy="138" rx="14" ry="5" fill="#c9a84c" fill-opacity="0.1"/>
