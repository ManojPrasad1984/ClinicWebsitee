  <rect x="274" y="140" width="10" height="60" rx="3" fill="#2a4880"/>
  <rect x="213" y="140" width="8" height="60" rx="2" fill="#243c70"/>
  <rect x="259" y="140" width="8" height="60" rx="2" fill="#243c70"/>
