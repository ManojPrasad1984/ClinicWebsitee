  <rect x="172" y="88" width="50" height="44" rx="25" fill="#c9a84c" fill-opacity="0.48"/>
  <rect x="175" y="110" width="44" height="22" fill="#c9a84c" fill-opacity="0.48"/>
  <line x1="197" y1="88" x2="197" y2="132" stroke="#0d1829" stroke-width="1.5"/>
  <line x1="172" y1="116" x2="222" y2="116" stroke="#0d1829" stroke-width="1.5"/>
  <ellipse cx="197" cy="100" rx="20" ry="14" fill="#c9a84c" fill-opacity="0.15"/>

  <rect x="258" y="88" width="50" height="44" rx="25" fill="#c9a84c" fill-opacity="0.40"/>
