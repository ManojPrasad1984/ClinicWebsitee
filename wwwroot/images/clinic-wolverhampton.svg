  <rect x="118" y="40" width="22" height="6" rx="2" fill="#2a4880"/>
  <rect x="342" y="46" width="18" height="24" rx="2" fill="#1a3060"/>
  <rect x="340" y="42" width="22" height="6" rx="2" fill="#2a4880"/>

