<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" width="700" height="820">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="700" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1829"/>
