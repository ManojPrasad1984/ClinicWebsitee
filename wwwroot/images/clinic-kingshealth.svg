    <linearGradient id="kh-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a3a6a" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" fill="url(#kh-sky)"/>

  <!-- Modern health centre - glass facade contemporary -->
  <!-- Ground -->
  <rect x="0" y="206" width="480" height="54" fill="#0a1420"/>
  <rect x="0" y="206" width="480" height="8" fill="#12202e"/>

  <!-- Side wings -->
  <rect x="0" y="110" width="100" height="102" fill="#102030"/>
  <rect x="8" y="118" width="84" height="94" fill="#142438"/>
  <rect x="14" y="126" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.3"/>
  <rect x="44" y="126" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.28"/>
  <rect x="74" y="126" width="18" height="20" rx="2" fill="#c9a84c" fill-opacity="0.25"/>
  <rect x="14" y="152" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.22"/>
  <rect x="44" y="152" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.2"/>

  <rect x="380" y="110" width="100" height="102" fill="#102030"/>
  <rect x="388" y="118" width="84" height="94" fill="#142438"/>
  <rect x="440" y="126" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.28"/>
  <rect x="410" y="126" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.25"/>
  <rect x="388" y="126" width="18" height="20" rx="2" fill="#c9a84c" fill-opacity="0.22"/>
  <rect x="410" y="152" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.18"/>
  <rect x="440" y="152" width="26" height="20" rx="2" fill="#c9a84c" fill-opacity="0.2"/>

  <!-- Main building modern -->
  <!-- Roof flat with parapet -->
  <rect x="100" y="32" width="280" height="14" rx="3" fill="#1e3a62"/>
  <rect x="98" y="28" width="284" height="6" rx="2" fill="#c9a84c" fill-opacity="0.55"/>
  <!-- Parapet detail -->
  <rect x="104" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="124" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="144" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="164" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="344" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="324" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="304" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>
  <rect x="284" y="36" width="14" height="10" rx="1" fill="#2a4a80"/>

  <!-- Large glass curtain wall facade -->
  <rect x="100" y="46" width="280" height="162" fill="#102040"/>
  <!-- Glass panels grid -->
  <rect x="104" y="50" width="272" height="154" fill="#0e1e38"/>
  <!-- Horizontal mullions -->
  <line x1="100" y1="96" x2="380" y2="96" stroke="#1e3a6a" stroke-width="3"/>
  <line x1="100" y1="144" x2="380" y2="144" stroke="#1e3a6a" stroke-width="3"/>
  <line x1="100" y1="168" x2="380" y2="168" stroke="#1e3a6a" stroke-width="2"/>
