  <line x1="172" y1="46" x2="172" y2="208" stroke="#1e3a6a" stroke-width="3"/>
  <line x1="240" y1="46" x2="240" y2="208" stroke="#1e3a6a" stroke-width="3"/>
  <line x1="308" y1="46" x2="308" y2="208" stroke="#1e3a6a" stroke-width="3"/>

  <!-- Glass panels with gold tint and reflections -->
  <rect x="106" y="50" width="62" height="44" fill="url(#kh-glass)"/>
  <rect x="174" y="50" width="62" height="44" fill="url(#kh-glass)"/>
  <rect x="242" y="50" width="62" height="44" fill="url(#kh-glass)"/>
  <rect x="310" y="50" width="66" height="44" fill="url(#kh-glass)"/>

  <rect x="106" y="98" width="62" height="44" fill="#c9a84c" fill-opacity="0.22"/>
  <rect x="174" y="98" width="62" height="44" fill="#c9a84c" fill-opacity="0.26"/>
  <rect x="242" y="98" width="62" height="44" fill="#c9a84c" fill-opacity="0.20"/>
  <rect x="310" y="98" width="66" height="44" fill="#c9a84c" fill-opacity="0.18"/>

  <!-- Reflection diagonal sweeps -->
  <line x1="106" y1="50" x2="168" y2="94" stroke="#fff" stroke-width="18" stroke-opacity="0.03"/>
  <line x1="174" y1="50" x2="236" y2="94" stroke="#fff" stroke-width="18" stroke-opacity="0.03"/>
  <line x1="106" y1="98" x2="168" y2="142" stroke="#fff" stroke-width="14" stroke-opacity="0.025"/>

  <!-- Lower glazing darker -->
  <rect x="106" y="148" width="62" height="56" fill="#0c1830" fill-opacity="0.6"/>
  <rect x="174" y="148" width="62" height="56" fill="#0c1830" fill-opacity="0.5"/>
  <rect x="242" y="148" width="62" height="56" fill="#0c1830" fill-opacity="0.55"/>
  <rect x="310" y="148" width="66" height="56" fill="#0c1830" fill-opacity="0.5"/>

  <!-- Entry lobby - illuminated -->
  <rect x="195" y="148" width="90" height="62" fill="#c9a84c" fill-opacity="0.28"/>
  <rect x="195" y="148" width="90" height="62" fill="#1a4080" fill-opacity="0.3"/>
  <!-- Lobby glow -->
  <ellipse cx="240" cy="180" rx="45" ry="30" fill="#c9a84c" fill-opacity="0.12"/>

  <!-- Automatic sliding doors -->
  <rect x="206" y="170" width="30" height="40" rx="1" fill="#0a1020" fill-opacity="0.9"/>
  <rect x="244" y="170" width="30" height="40" rx="1" fill="#0a1020" fill-opacity="0.9"/>
  <rect x="207" y="171" width="28" height="38" rx="1" fill="#c9a84c" fill-opacity="0.14"/>
  <rect x="245" y="171" width="28" height="38" rx="1" fill="#c9a84c" fill-opacity="0.14"/>
  <line x1="221" y1="171" x2="221" y2="209" stroke="#1e3a6a" stroke-width="1.5"/>
  <line x1="259" y1="171" x2="259" y2="209" stroke="#1e3a6a" stroke-width="1.5"/>

