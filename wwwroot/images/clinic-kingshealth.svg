  <rect x="135" y="56" width="210" height="22" rx="3" fill="#c9a84c" fill-opacity="0.18" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="142" y="61" width="155" height="5" rx="2" fill="#c9a84c" fill-opacity="0.75"/>
  <rect x="155" y="70" width="130" height="3.5" rx="1.75" fill="#c9a84c" fill-opacity="0.45"/>

  <!-- Steps and entrance canopy -->
  <rect x="175" y="204" width="130" height="5" rx="1" fill="#1e3a5a"/>
  <rect x="182" y="209" width="116" height="4" rx="1" fill="#162848"/>
  <!-- Canopy -->
  <rect x="180" y="162" width="120" height="8" rx="2" fill="#c9a84c" fill-opacity="0.75"/>
  <rect x="186" y="170" width="3" height="32" rx="1.5" fill="#c9a84c" fill-opacity="0.6"/>
  <rect x="291" y="170" width="3" height="32" rx="1.5" fill="#c9a84c" fill-opacity="0.6"/>

  <!-- Flagpole -->
  <rect x="98" y="14" width="3" height="40" rx="1.5" fill="#2a4a72"/>
  <rect x="101" y="14" width="26" height="18" rx="2" fill="#c9a84c" fill-opacity="0.75"/>
  <rect x="101" y="14" width="26" height="6" rx="1" fill="#c9a84c"/>
</svg>
